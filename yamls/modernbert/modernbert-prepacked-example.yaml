# Example configuration for pre-packed streaming datasets
# This config demonstrates how to use pre-packed datasets that were created offline
# using src/pack_dataset.py

data_local: /path/to/prepacked/data
data_remote: # If blank, files must be present in data_local

max_seq_len: 1024
tokenizer_name: dbmdz/bert-base-turkish-cased
mlm_probability: 0.3
count_padding_tokens: false

# Run Name
run_name: modernbert-base-pretrain-prepacked-example

# Model (same as regular config)
model:
  name: flex_bert
  pretrained_model_name: bert-base-uncased
  tokenizer_name: ${tokenizer_name}
  disable_train_metrics: true
  model_config:
    vocab_size: 32000
    init_method: full_megatron
    num_hidden_layers: 22
    hidden_size: 768
    intermediate_size: 1152
    num_attention_heads: 12
    attention_layer: rope
    attention_probs_dropout_prob: 0.0
    attn_out_bias: false
    attn_out_dropout_prob: 0.1
    attn_qkv_bias: false
    bert_layer: prenorm
    embed_dropout_prob: 0.0
    embed_norm: true
    final_norm: true
    skip_first_prenorm: true
    embedding_layer: sans_pos
    loss_function: fa_cross_entropy
    loss_kwargs:
      reduction: mean
    mlp_dropout_prob: 0.0
    mlp_in_bias: false
    mlp_layer: glu
    mlp_out_bias: false
    normalization: layernorm
    norm_kwargs:
      eps: 1e-5
      bias: false
    hidden_act: gelu
    head_pred_act: gelu
    activation_function: gelu
    padding: unpadded
    rotary_emb_dim: null
    rotary_emb_base: 10000.0
    rotary_emb_scale_base: null
    rotary_emb_interleaved: false
    allow_embedding_resizing: true
    sliding_window: 128
    global_attn_every_n_layers: 3
    unpad_embeddings: true
    compile_model: true
    masked_prediction: true

# Dataloaders with pre-packed streaming
train_loader:
  name: text
  dataset:
    # Option 1: Single source
    local: ${data_local}
    remote: ${data_remote}
    split: train
    
    # Option 2: Multiple sources with weighting (uncomment to use)
    # streams:
    #   stream1:
    #     local: /path/to/berturk-corpus-packed
    #     split: train
    #     proportion: 0.75
    #   stream2:
    #     local: /path/to/fineweb-2-turkish-packed
    #     split: train
    #     proportion: 0.25
    
    tokenizer_name: ${tokenizer_name}
    max_seq_len: ${max_seq_len}
    shuffle: true
    mlm_probability: ${mlm_probability}
    streaming: true
    pre_packed: true  # IMPORTANT: signals data is pre-packed
    eos_token_id: 2  # REQUIRED: needed to derive cu_seqlens from packed data
  drop_last: true
  num_workers: 24
  sequence_packing: false  # Must be false when using pre_packed=true

eval_loader:
  name: text
  dataset:
    local: ${data_local}
    remote: ${data_remote}
    split: validation
    tokenizer_name: ${tokenizer_name}
    max_seq_len: ${max_seq_len}
    shuffle: false
    mlm_probability: 0.15
    streaming: false
  drop_last: false
  num_workers: 3
  sequence_packing: false

# Optimization
scheduler:
  name: warmup_stable_decay
  t_warmup: 100_000_000tok
  alpha_f: 0.00
  t_decay: 0tok

optimizer:
  name: decoupled_stableadamw
  lr: 8e-4
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-06
  weight_decay: 1.0e-5
  filter_bias_norm_wd: true
  log_grad_norm: true

max_duration: 1_000_000_000tok
eval_interval: 2000ba
global_train_batch_size: 4608
global_eval_batch_size: 1024

# System
seed: 17
device_eval_batch_size: 128
device_train_microbatch_size: 96
precision: amp_bf16

# Logging
progress_bar: false
log_to_console: true
console_log_interval: 100ba

callbacks:
  speed_monitor:
    window_size: 100
  lr_monitor: {}
  scheduled_gc: {}
  log_grad_norm:
    batch_log_interval: 10

# Checkpoint to local filesystem or remote object store
save_interval: 2000ba
save_num_checkpoints_to_keep: -1
save_folder: checkpoints/{run_name}

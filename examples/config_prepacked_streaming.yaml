# Example configuration for training with pre-packed streaming datasets
#
# This config demonstrates how to use offline sequence packing with streaming.
#
# To create a pre-packed dataset, first run:
#   python src/pack_dataset.py \
#     --sources /path/to/dataset:train \
#     --output /path/to/packed-output \
#     --tokenizer dbmdz/bert-base-turkish-cased \
#     --max_seq_len 1024 \
#     --seed 42

data_local: /path/to/packed-output  # Output directory from pack_dataset.py
data_remote: # Leave blank for local datasets

max_seq_len: 1024
tokenizer_name: dbmdz/bert-base-turkish-cased
mlm_probability: 0.3  # Required for pre-packed datasets
count_padding_tokens: false

# Run Name
run_name: modernbert-prepacked-example

# Model
model:
  name: flex_bert
  pretrained_model_name: bert-base-uncased
  tokenizer_name: ${tokenizer_name}
  disable_train_metrics: true
  model_config:
    # ... (your model config here)
    vocab_size: 50000
    num_hidden_layers: 22
    hidden_size: 768
    intermediate_size: 1152
    num_attention_heads: 12
    max_position_embeddings: ${max_seq_len}

# Dataloaders
train_loader:
  name: text
  dataset:
    local: ${data_local}
    remote: ${data_remote}
    split: train  # Optional - omit if data is not split
    max_seq_len: ${max_seq_len}
    shuffle: true
    mlm_probability: ${mlm_probability}  # MLM masking is applied at runtime
    streaming: true   # Required for pre-packed datasets
    prepacked: true   # NEW: Indicates this is pre-packed data
  drop_last: true
  num_workers: 24

# NOTE: Pre-packed datasets do NOT support:
#   - sequence_packing: this is already done offline
#   - Non-streaming mode: prepacked requires streaming=true

# Global training config
global_train_batch_size: 256
device_train_batch_size: 32
device_train_microbatch_size: 32

# Optimizer
optimizer:
  lr: 2e-4
  betas: [0.9, 0.98]
  eps: 1e-6
  weight_decay: 0.01

# Scheduler
scheduler:
  name: linear_with_warmup
  t_warmup: 2000
  alpha_f: 0.1

# Training duration
max_duration: 100000ba  # 100K batches
eval_interval: 5000ba
